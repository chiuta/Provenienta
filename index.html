  /** Chei cunoscute: fff.<slug>.*, cheile deja indexate în acest browser, cele declarate (fff-info storageKeys/bundleKeys, bundle.allow);

  function unknownKeys(keys) {
    var decl = declaredKeys(), idx = Object.create(null);

      if (k.indexOf(pfx) === 0 || idx[k] === 1) return false;
      if (F.store.appPrefix && k.indexOf(F.store.appPrefix) === 0) return false;   // modulul „store”: <slug>.*

        if (d.charAt(d.length - 1) === '*') return k.indexOf(d.slice(0, -1)) === 0;

    allow: function (list) { [].concat(list || []).forEach(function (x) { if (typeof x === 'string' && x) allowed.push(x); }); },
    build: function () { return plain(false); },

    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

              {label: T('sens_plain'), value: 'plain'},
              {label: T('sens_enc'), value: 'enc', primary: true}

    inspect: function (file, opt) {

          '\n\n' + T('import_keys', {list: keyList(keys)}) +
          (unknown.length ? '\n\n' + T('import_unknown', {n: unknown.length, list: keyList(unknown)}) : '');

          .then(function (ok) {

            try {

    wipe: function (opt) {
      opt = opt || {};
      var keys = F.store.indexKeys();
      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});

        if (!ok) return {keys: 0, cancelled: true};

        try { F.store.raw.remove(F.store.indexKey); } catch (e) { /* ignorat */ }

        F.bus.emit('bundle:wiped', {keys: keys.length});
        if (opt.reload === true) setTimeout(function () { location.reload(); }, opt.delay == null ? 900 : opt.delay);
        return {keys: keys.length, cancelled: false};
      });
    }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:anywhere}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;z-index:10}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
h1{margin:0;font-size:1.6rem;color:var(--accent)}
.tag{margin:2px 0 0;color:var(--muted);max-width:62ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.92rem}
main{padding-top:16px;padding-bottom:28px}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.notice strong{color:var(--warn)}
.modes{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-bottom:12px}
.slot[hidden]{display:none}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--panel);padding:16px;height:100%}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin:0 0 4px;font-size:1.1rem}
.hint{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fname{margin:8px 0 0;font-weight:600;min-height:1.5em}
#sample-note,#status{color:var(--muted);margin:4px 0;min-height:1.4em}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.stack-s{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}.stack>*,.card{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{margin:0 0 10px;font-size:1.15rem}
.card h3{margin:12px 0 6px;font-size:1rem}
.card h4{margin:8px 0 4px;font-size:.95rem}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:flex-start;gap:6px;padding:3px 10px;border-radius:14px;border:1px solid var(--line);font-size:.95rem;line-height:1.35;max-width:100%}
.chip .ic{font-weight:700;min-width:1em;text-align:center}
.chip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.chip.info{background:var(--accent-soft);border-color:var(--line);color:var(--accent)}
.state-row{display:grid;gap:4px}
.why{margin:0;color:var(--muted);font-size:.95rem}
.badge{display:inline-block;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:.85rem;margin:1px 2px}
.badge.ai,.badge.ai-partial{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.badge.capture{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.badge.algo,.badge.other{color:var(--muted)}
.ai-yes,.ai-partial{font-weight:600;color:var(--warn)}
.bad-t{color:var(--bad)}
dl.kv{display:grid;grid-template-columns:minmax(120px,30%) minmax(0,1fr);gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
@media (max-width:600px){dl.kv{grid-template-columns:minmax(0,1fr)}dl.kv dt{margin-top:6px}}
.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.tl{margin:0 0 0 6px;padding:0 0 0 22px;display:grid;gap:14px;list-style:none;border-left:2px solid var(--line)}
ol.tl>li{position:relative}
ol.tl>li::before{content:"";position:absolute;left:-30px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg,#fff)}
ol.tl>li.prev::before{background:var(--muted)}
.tl-when{color:var(--muted);font-size:.92rem;margin:2px 0}
.tl-when time{font-weight:600;color:var(--fg,inherit)}
#trust h2{font-size:1.1rem;margin:0 0 6px}
#trust .tbl{min-width:560px}
#trust td.fp{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;overflow-wrap:anywhere}
.tl-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px}
.tbl{border-collapse:collapse;width:100%;min-width:480px}
.tbl caption{text-align:left;padding:8px;font-weight:600}
.tbl th,.tbl td{padding:6px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{background:var(--accent-soft)}
tr.diff td,tr.diff th{background:var(--warn-bg)}
.cert{border-top:1px solid var(--line);margin-top:10px;padding-top:4px}
details>summary{cursor:pointer;padding:2px 0}
ul.tree{list-style:none;margin:0;padding-left:16px;border-left:1px dotted var(--line)}
ul.tree.root{padding-left:0;border:0}
ul.tree .leaf{padding:1px 0 1px 4px}
.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem;font-weight:600}
.val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
.checks{display:grid;gap:6px;margin-bottom:6px}
.thumb{margin:10px 0 0}.thumb img{border:1px solid var(--line);border-radius:6px;height:auto;max-width:96px}
.notice-card h3{margin:0 0 8px}
#limits{margin-top:14px}
#limits h2{font-size:1.1rem}
footer{border-top:1px solid var(--line);padding:14px 0 24px;color:var(--muted);font-size:.92rem}
footer .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
footer button{font:inherit;color:var(--accent);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
@media print{.noprint,header .tools,.modes,.slots,#sample-note,footer button{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;border-color:#999}}

input[type=checkbox],input[type=radio]{min-width:24px;min-height:24px}
</style>
